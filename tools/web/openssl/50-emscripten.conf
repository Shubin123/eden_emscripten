# OpenSSL target for Emscripten Memory64 builds, picked up via OPENSSL_LOCAL_CONFIG_DIR.

my %targets = (
    "emscripten-wasm64" => {
        inherit_from => [ "linux-generic64" ],
        disable      => [ "asm", "afalgeng", "async", "devcryptoeng", "dso" ],
    },
);
